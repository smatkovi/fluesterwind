description "Fluesterwind-Dienst anstossen"
author "Sebastian"
start on EXT_APPS_STARTED
stop on stopping xsession
respawn
respawn limit 20 120

# Dieser Job startet den Dienst *nicht* selbst, er stoesst ihn nur an.
#
# Ein Job unter /etc/init/apps laeuft als uid 0, aber mit leerem
# Rechtesatz: keine Nebengruppe, keine Capability. Von dort scheitert jeder
# Kennungswechsel still -- aegis-exec landet auf nobody, und nobody kommt
# nicht an das Datenverzeichnis des Benutzers. Der Sitzungs-D-Bus ist
# dagegen auch fuer diesen nackten root erreichbar, und ein darueber
# aktivierter Dienst laeuft als Besitzer des Busses, also als "user".
#
# Vor jedem Anstoss wird nachgesehen, ob der Dienst schon antwortet.
# Anders als beim WhatsApp-Port beansprucht dieser Dienst keinen
# D-Bus-Namen; ohne die Pruefung wuerde D-Bus alle fuenf Minuten einen
# Prozess starten, der an der Dateisperre sofort wieder abbricht. Das
# taete nichts Schlimmes, waere aber Arbeit ohne Zweck.
script
    BUS=$(sed -n 's/.*DBUS_SESSION_BUS_ADDRESS=//p' /tmp/session_bus_address.user \
          | tr -d '";' | head -1)
    [ -n "$BUS" ] || exit 0
    export DBUS_SESSION_BUS_ADDRESS="$BUS"
    while true; do
        LAEUFT=0
        for p in 8095 8096 8097 8098 8099; do
            if curl -s -m 2 "http://127.0.0.1:$p/status" >/dev/null 2>&1; then
                LAEUFT=1
                break
            fi
        done
        if [ "$LAEUFT" = "0" ]; then
            dbus-send --session --print-reply --dest=org.freedesktop.DBus \
                /org/freedesktop/DBus org.freedesktop.DBus.StartServiceByName \
                string:org.smatkovi.Fluesterwind uint32:0 >/dev/null 2>&1
        fi
        sleep 300
    done
end script
